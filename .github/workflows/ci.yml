name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: edumind
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: edumind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edumind -d edumind_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://edumind:ci-only-password@localhost:5432/edumind_test
      TEST_DATABASE_URL: postgresql+psycopg://edumind:ci-only-password@localhost:5432/edumind_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: pip-audit -r requirements.txt
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  browser:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: edumind
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: edumind_browser_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edumind -d edumind_browser_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://edumind:ci-only-password@127.0.0.1:5432/edumind_browser_test
      TEST_DATABASE_URL: postgresql+psycopg://edumind:ci-only-password@127.0.0.1:5432/edumind_browser_test
      APP_ENV: test
      CORS_ORIGINS: '["http://127.0.0.1:4173"]'
      VITE_API_BASE_URL: http://127.0.0.1:8000
      LOGIN_IP_LIMIT: '1000'
      LOGIN_ACCOUNT_LIMIT: '1000'
      REGISTER_IP_LIMIT: '1000'
      AUTH_IP_LIMIT: '1000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate ephemeral test credentials
        run: |
          python - <<'PYCODE'
          import os, secrets
          values = {"JWT_SECRET": secrets.token_urlsafe(48), "E2E_TEST_PASSWORD": secrets.token_urlsafe(24)}
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for key, value in values.items():
                  print("::add-mask::" + value)
                  output.write(key + "=" + value + "\n")
          PYCODE
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: PYTHONPATH=. python tests/seed_e2e.py
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  local-inbox:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/knowledge-inbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_inbox
